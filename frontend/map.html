<!DOCTYPE html>
<html>
<head>
    <title>Disaster Map - AidFlow AI</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #map { height: 100vh; width: 100%; }

        /* Legend styling fixed in place around Andaman & Nicobar */
        .legend {
            position: absolute;
            top: 450px; /* Adjust vertically */
            right: 20px; /* Adjust horizontally */
            background: white;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
            font-size: 14px;
            z-index: 1000;
            max-height: 300px;
            overflow-y: auto;
        }

        .legend div { margin-bottom: 4px; }

        /* Simple control panel for loading routes */
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1001;
            background: rgba(255,255,255,0.95);
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }
        .controls input[type="text"] {
            width: 260px;
            padding: 6px 8px;
            margin-bottom: 6px;
        }
        .controls button {
            padding: 6px 10px;
            margin-left: 6px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div class="controls">
    <div>
        <label><strong>Load route by path</strong></label><br/>
        <input id="routePath" type="text" placeholder="e.g. route_exports/himachal_to_maharashtra_alt_1.geojson"/>
        <button id="loadPathBtn">Load</button>
    </div>
    <div style="margin-top:8px;">
        <label><strong>Or upload route GeoJSON</strong></label><br/>
        <input id="routeFile" type="file" accept="application/geo+json,.geojson,application/json"/>
    </div>
    <div style="margin-top:8px; font-size:12px; color:#444;">
        Tip: Exports are saved in <code>route_exports/</code>
    </div>
    <div id="routeInfo" style="margin-top:8px; font-size:12px;"></div>
    <div style="margin-top:6px;">
        <button id="clearRoutesBtn">Clear routes</button>
    </div>
  </div>
<div class="legend" id="legend"><strong>Disasters</strong></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([22.5, 79.0], 5);
    var routesLayer = L.layerGroup().addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Disaster colors
    const disasterColors = {
        "bridges_any": "blue",
        "bridges_damage": "darkblue",
        "buildings_affected": "orange",
        "buildings_any": "gold",
        "buildings_destroyed": "red",
        "buildings_major": "darkred",
        "buildings_minor": "pink",
        "debris_any": "brown",
        "flooding_any": "purple",
        "flooding_structures": "darkviolet",
        "roads_any": "gray",
        "roads_damage": "black",
        "trees_any": "green",
        "trees_damage": "darkgreen",
        "water_any": "cyan"
    };

    const labelMapping = {
        "bridges_any": "Bridges",
        "bridges_damage": "Bridges Damage",
        "buildings_affected": "Buildings Affected",
        "buildings_any": "Buildings",
        "buildings_destroyed": "Buildings Destroyed",
        "buildings_major": "Buildings Major",
        "buildings_minor": "Buildings Minor",
        "debris_any": "Debris",
        "flooding_any": "Flooding",
        "flooding_structures": "Flooding Structures",
        "roads_any": "Roads",
        "roads_damage": "Roads Damage",
        "trees_any": "Trees",
        "trees_damage": "Trees Damage",
        "water_any": "Water"
    };

    // Populate legend
    const legendDiv = document.getElementById('legend');
    for (const key in disasterColors) {
        if (disasterColors.hasOwnProperty(key)) {
            const color = disasterColors[key];
            const label = labelMapping[key];
            const entry = document.createElement('div');
            entry.innerHTML = `<span style="color:${color}">●</span> ${label}`;
            legendDiv.appendChild(entry);
        }
    }

    // Load GeoJSON data
    fetch('predictions_map.geojson')
    .then(response => response.json())
    .then(data => {
        var markers = [];

        data.features.forEach(feature => {
            var lat = feature.geometry.coordinates[1];
            var lon = feature.geometry.coordinates[0];

            var disastersDetected = [];
            for (var key in feature.properties) {
                if (feature.properties.hasOwnProperty(key) && disasterColors[key]) {
                    if (feature.properties[key] > 0.5) {
                        disastersDetected.push(labelMapping[key]);
                    }
                }
            }

            // Determine marker color
            var color = disastersDetected.length > 0 ? disasterColors[Object.keys(disasterColors).find(k => disastersDetected.includes(labelMapping[k]))] : "gray";

            // Create original Leaflet marker
            var marker = L.marker([lat, lon]).addTo(map);

            // Add colored circle around original marker to indicate disaster
            var circle = L.circleMarker([lat, lon], {
                radius: 8,
                color: color,
                fillColor: color,
                fillOpacity: 0.7,
                weight: 2
            }).addTo(map);

            // Popup content
            var popupContent = disastersDetected.length > 0 ? "Disasters detected:<br>- " + disastersDetected.join("<br>- ") : "Disasters detected: None";
            marker.bindPopup(popupContent);
            circle.bindPopup(popupContent);

            markers.push(marker);
        });

        var group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
    });

    // ---------- Route visualization helpers ----------
    function styleRouteFeature(feature) {
        var isSafe = true;
        if (feature && feature.properties && typeof feature.properties.is_safe !== 'undefined') {
            isSafe = !!feature.properties.is_safe;
        }
        return {
            color: isSafe ? '#2e7d32' : '#c62828',
            weight: 4,
            opacity: 0.9,
            dashArray: isSafe ? null : '6,6'
        };
    }

    function addRouteGeoJSON(geojson) {
        // Support both Feature and FeatureCollection
        var layer;
        if (geojson.type === 'FeatureCollection') {
            layer = L.geoJSON(geojson, {
                style: styleRouteFeature,
                onEachFeature: function (feature, lyr) {
                    var p = feature.properties || {};
                    var name = p.name || 'Route';
                    var dist = p.distance_km || p.distance || 0;
                    var dur = p.duration_hours || p.duration || 0;
                    var risk = typeof p.risk_score !== 'undefined' ? p.risk_score : 'n/a';
                    var safe = typeof p.is_safe !== 'undefined' ? p.is_safe : true;
                    lyr.bindPopup(
                        `<strong>${name}</strong><br/>` +
                        `Distance: ${Number(dist).toFixed(1)} km<br/>` +
                        `Duration: ${Number(dur).toFixed(2)} h<br/>` +
                        `Safe: ${safe ? 'Yes' : 'No'}<br/>` +
                        `Risk score: ${risk}`
                    );
                }
            });
        } else if (geojson.type === 'Feature') {
            layer = L.geoJSON(geojson, { style: styleRouteFeature });
        } else {
            // Minimal wrapper if the file is a bare geometry
            layer = L.geoJSON({ type: 'Feature', geometry: geojson }, { style: styleRouteFeature });
        }
        routesLayer.addLayer(layer);
        try {
            map.fitBounds(layer.getBounds().pad(0.2));
        } catch(e) {}
        return layer;
    }

    function loadRouteFromPath(path) {
        const info = document.getElementById('routeInfo');
        info.textContent = 'Loading: ' + path + ' ...';
        fetch(path)
            .then(resp => {
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                return resp.json();
            })
            .then(json => {
                addRouteGeoJSON(json);
                info.textContent = 'Loaded: ' + path;
            })
            .catch(err => {
                info.textContent = 'Failed to load ' + path + ': ' + err.message;
            });
    }

    function handleFileUpload(file) {
        const info = document.getElementById('routeInfo');
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                addRouteGeoJSON(json);
                info.textContent = 'Loaded file: ' + (file.name || 'uploaded');
            } catch (err) {
                info.textContent = 'Invalid GeoJSON: ' + err.message;
            }
        };
        reader.readAsText(file);
    }

    // Wire up controls
    document.getElementById('loadPathBtn').addEventListener('click', function() {
        const p = document.getElementById('routePath').value.trim();
        if (p) loadRouteFromPath(p);
    });
    document.getElementById('routeFile').addEventListener('change', function(evt) {
        if (evt.target.files && evt.target.files[0]) {
            handleFileUpload(evt.target.files[0]);
            evt.target.value = '';
        }
    });
    document.getElementById('clearRoutesBtn').addEventListener('click', function() {
        routesLayer.clearLayers();
        document.getElementById('routeInfo').textContent = '';
    });
</script>
</body>
</html>
