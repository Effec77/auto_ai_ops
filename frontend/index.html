<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AidFlow AI - Disaster Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>

  <div id="map"></div>
    
  <script>
    // Initialize the map
    var map = L.map('map').setView([22.5, 78.9], 5);  // Centered on India

    // Add OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load and display disaster markers from map_data.json
    fetch("map_data.json")
      .then(response => response.json())
      .then(data => {
        data.forEach(item => {
          const { image_name, latitude, longitude, timestamp, predicted_labels } = item;

          const popupContent = `
            <strong>${image_name}</strong><br/>
            <b>Time:</b> ${timestamp}<br/>
            <b>Labels:</b> ${predicted_labels.join(", ")}
          `;

          L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(popupContent);
        });
      })
      .catch(err => {
        console.error("Error loading map_data.json:", err);
      });
  </script>

</body>
</html>
